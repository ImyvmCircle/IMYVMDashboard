services:
  imyvm-dashboard:
    build:
      context: .
    image: imyvm-dashboard:latest
    container_name: imyvm-dashboard
    restart: unless-stopped
    environment:
      IMYVM_DATA_SOURCE: mock
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
    ports:
      - "3000:3000"
